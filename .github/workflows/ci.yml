name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Compilar API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar
        run: dotnet build api/GymApi/GymApi.csproj -c Release

  app:
    name: Analizar y probar app Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Las sugerencias de estilo (infos) no bloquean; los avisos y errores sí
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  sql:
    name: Validar scripts SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Contraseña aleatoria para el contenedor efímero: no hace falta configurar secretos
      - name: Generar contraseña temporal
        run: |
          PASS="Ci-$(openssl rand -hex 16)-Aa1!"
          echo "::add-mask::$PASS"
          echo "MSSQL_SA_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Arrancar SQL Server 2022
        run: |
          docker run -d --name sql \
            -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD" \
            -v "$GITHUB_WORKSPACE/sql:/scripts:ro" \
            mcr.microsoft.com/mssql/server:2022-latest
          SQLCMD=$(docker exec sql bash -c 'ls /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd 2>/dev/null | head -n 1')
          echo "SQLCMD=$SQLCMD" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker exec sql "$SQLCMD" -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server listo"; exit 0
            fi
            sleep 2
          done
          docker logs sql
          exit 1

      # -b: se detiene ante cualquier error; -I: QUOTED_IDENTIFIER ON (necesario para índices filtrados)
      # El script 00 crea App_Gym y el resto empieza con USE App_Gym
      - name: Ejecutar scripts en orden
        run: |
          for f in $(ls sql/*.sql | sort); do
            echo "::group::$f"
            docker exec sql "$SQLCMD" -C -b -I -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -i "/scripts/$(basename "$f")"
            echo "::endgroup::"
          done
