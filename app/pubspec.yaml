name: app_gimnasio
description: App de entrenamiento con rutinas que se adaptan al esfuerzo.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # Mapas: flutter_map 8 (raster, multiplataforma) y coordenadas
  flutter_map: ^8.0.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Ilustraciones de ejercicios: Everkinetic, CC BY-SA 4.0 (ver assets/ejercicios/LICENCIA.txt)
  assets:
    - assets/ejercicios/

  # Fuentes con licencia SIL Open Font License 1.1 (textos en fonts/OFL-*.txt)
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: fonts/BarlowCondensed-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: fonts/BarlowCondensed-BlackItalic.ttf
          weight: 900
          style: italic
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
