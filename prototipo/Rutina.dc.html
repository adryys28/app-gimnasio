<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi rutina</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#F3F0E8;color:#1B1A17}
button{font-family:inherit;cursor:pointer}
a{color:#9A3412}a:hover{color:#7C2D12}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 18px; background: #F3F0E8; font-family: 'Instrument Sans', system-ui, sans-serif; color: #1B1A17">

<header style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 40px; line-height: 1; font-weight: 700">Mi rutina</h1>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600">Nueva rutina</a>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<p style="margin: 0; font-size: 15px; color: #5C5850">Full body 3 días</p>
<span style="padding: 3px 8px; border-radius: 999px; background: #E9E5DC; color: #45423C; font-size: 12px; font-weight: 600">Sugerida</span>
</div>
</header>

<div role="tablist" aria-label="Días de la rutina" style="display: flex; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" onClick="{{t.pick}}" aria-selected="{{t.selected}}" style="flex-grow: 1; min-height: 44px; border-radius: 12px; border: 1.5px solid {{t.borde}}; background: {{t.fondo}}; color: {{t.texto}}; font-size: 15px; font-weight: 600">{{t.nombre}}</button>
</sc-for>
<button type="button" aria-label="Añadir día" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; border: 1.5px dashed #A8A195; background: transparent; color: #1B1A17; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700">{{diaNombre}}</h2>
<button type="button" aria-label="Renombrar día" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DDD7CB; background: #FFFFFF; color: #1B1A17; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg></button>
</div>

<ol role="tabpanel" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ejercicios}}" as="e" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 4px; min-height: 64px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDD7CB">
<button type="button" aria-label="Mover {{e.nombre}}" style="flex-shrink: 0; width: 44px; height: 44px; border: none; background: transparent; color: #8A8478; display: flex; align-items: center; justify-content: center; cursor: grab">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button>
<a href="Configurar.dc.html" style="flex-grow: 1; display: flex; align-items: center; gap: 10px; min-height: 56px; text-decoration: none; color: #1B1A17">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{e.nombre}}</span><span style="font-size: 14px; color: #5C5850">{{e.detalle}}</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: #5C5850; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</li>
</sc-for>
</ol>

<a href="Ejercicio.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; border: 1.5px dashed #A8A195; color: #1B1A17; font-size: 15px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>Añadir ejercicio</a>

<button type="button" style="align-self: flex-start; min-height: 44px; padding: 0; border: none; background: transparent; color: #B42318; font-size: 15px; font-weight: 600">Quitar este día</button>

<nav aria-label="Principal" style="margin: auto -20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px 12px 10px; background: #FFFFFF; border-top: 1px solid #DDD7CB">
<a href="Hoy.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; text-decoration: none; color: #5C5850; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Hoy</a>
<a href="Rutina.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg>Rutina</a>
<a href="Ejercicio.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; text-decoration: none; color: #5C5850; font-size: 12px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Ejercicios</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4E89","#0F766E","#6D28D9"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { dia: 'A' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C2410C';
    const dias = {
      A: { nombre: 'Full body A', ejercicios: [
        { nombre: 'Sentadilla goblet', detalle: '3 × 10–12 reps · 12 kg' },
        { nombre: 'Flexiones', detalle: '3 × 10–12 reps' },
        { nombre: 'Remo con mancuerna', detalle: '3 × 8–10 reps · 17 kg' },
        { nombre: 'Plancha frontal', detalle: '3 × 30–45 s' }
      ] },
      B: { nombre: 'Full body B', ejercicios: [
        { nombre: 'Peso muerto rumano con mancuernas', detalle: '3 × 10–12 reps · 14 kg' },
        { nombre: 'Press militar con mancuernas', detalle: '3 × 10–12 reps · 8 kg' },
        { nombre: 'Jalón al pecho', detalle: '3 × 10–12 reps · 35 kg' }
      ] },
      C: { nombre: 'Full body C', ejercicios: [
        { nombre: 'Zancadas', detalle: '3 × 10–12 reps' },
        { nombre: 'Flexiones', detalle: '3 × 10–12 reps' },
        { nombre: 'Hip thrust', detalle: '3 × 10–12 reps · 40 kg' },
        { nombre: 'Remo con mancuerna', detalle: '3 × 8–10 reps · 17 kg' }
      ] }
    };
    const tabs = ['A', 'B', 'C'].map((id) => {
      const on = this.state.dia === id;
      return {
        nombre: 'Día ' + id,
        selected: on ? 'true' : 'false',
        borde: on ? '#1B1A17' : '#DDD7CB',
        fondo: on ? '#1B1A17' : '#FFFFFF',
        texto: on ? '#FFFFFF' : '#1B1A17',
        pick: () => this.setState({ dia: id })
      };
    });
    const actual = dias[this.state.dia];
    return { accent, tabs, diaNombre: actual.nombre, ejercicios: actual.ejercicios };
  }
}
</script>
</body>
</html>
